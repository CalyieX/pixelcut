name: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write          # PyPI "trusted publishing": no token or password is stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: tag must match the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
