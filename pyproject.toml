[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcut"
version = "1.9.7"
description = "Lossless image splitter and joiner: cut pictures into grids, wedges or label-map shapes without changing a pixel, plus color-to-alpha, upscale and batch."
keywords = ["image-splitting", "image-slicer", "lossless", "pixel-perfect", "color-to-alpha", "transparent-background", "sprite", "ui-assets", "game-assets", "batch", "upscale", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "opencv-python-headless>=4.7,<5", "Pillow>=9.5,<13", "scikit-image>=0.20,<1", "vtracer>=0.6,<1"]

[project.urls]
Homepage = "https://github.com/CalyieX/pixelcut"
Browser = "https://calyiex.github.io/pixelcut/"
Issues = "https://github.com/CalyieX/pixelcut/issues"

[project.optional-dependencies]
test = ["pytest"]
matting = ["pymatting"]

[project.scripts]
pixelcut = "pixelcut:main"

[tool.setuptools]
py-modules = ["pixelcut"]
