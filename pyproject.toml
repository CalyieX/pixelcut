[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcut"
version = "1.5.0"
description = "K&K pixelcut - cut a picture into parts without changing a single pixel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "opencv-python-headless>=4.7,<5", "Pillow>=9.5,<13", "scikit-image>=0.20,<1", "vtracer>=0.6,<1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pixelcut = "pixelcut:main"

[tool.setuptools]
py-modules = ["pixelcut"]
